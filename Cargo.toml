[package]
name = "cup-cli"
version = "0.1.0"
edition = "2024"
authors = ["Anglebase"]
description = "A Cargo-like tool for C++ Project Building and Package Management"
license = "MIT"
repository = "https://github.com/Anglebase/Cup/tree/cup-rs"

[[bin]]
path = "src/main.rs"
name = "cup"

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
colored = "3.0.0"
