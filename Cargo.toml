[package]
name = "cup-cli"
version = "0.1.3"
edition = "2024"
authors = ["Anglebase"]
description = "A Cargo-like tool for C++ Project Building and Package Management"
license = "MIT"
repository = "https://github.com/Anglebase/Cup/tree/cup-rs"
exclude = ["docs/**"]

[[bin]]
path = "src/main.rs"
name = "cup"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
colored = "3.0.0"
constcat = "0.6.1"
fs-err = "3.1.2"
path-clean = "1.0.1"
