[package]
name = "cup-cli"
version = "0.1.6"
edition = "2024"
authors = ["Anglebase"]
description = "A Cargo-like tool for C++ Project Building and Package Management"
license = "MIT"
repository = "https://github.com/Anglebase/Cup/tree/cup-rs"
exclude = ["docs/**"]

[[bin]]
path = "src/main.rs"
name = "cup"

[dependencies]
anyhow = "1.0.99"
clap = { version = "4.5.47", features = ["derive"] }
colored = "3.0.0"
constcat = "0.6.1"
flate2 = "1.1.2"
fs-err = "3.1.2"
futures = "0.3.31"
git2 = "0.20.2"
glob = "0.3.3"
lazy_static = "1.5.0"
octocrab = "0.45.0"
path-clean = "1.0.1"
petgraph = "0.8.2"
reqwest = "0.12.23"
serde = { version = "1.0.225", features = ["derive"] }
tar = "0.4.44"
tokio = { version = "1.47.1", features = ["full"] }
toml = "0.9.6"
